# Grant Risk Estimator: default configuration (ARC-03).
# Relative paths are resolved against the repository root.
# Secrets never go here; they come from environment variables (.env, ARC-08).

data_root: data            # database and file store (DEC-22); not under version control

# Read-only inputs from the old code line (DEC-23). Nothing here is ever modified.
sources:
  scraped_pdfs: ../20_GrantRiskEstimator/data/raw_pdfs
  scrape_log: ../20_GrantRiskEstimator/data/scrape_log.csv
  old_database: ../20_GrantRiskEstimator/data/palyazat.db
  manual_zip: ../00_Archívum/Pipeline_V0/Pipeline_V0.zip
  gold_csv: ../20_GrantRiskEstimator/data/Gold_second.csv
  old_baseline: ../20_GrantRiskEstimator/data/Gold_second_test_results_final.csv  # old regex points (column regex), SPEC-E1-02

acquire:                   # C1; the import configuration (manual call codes, overrides, gold pins) comes with C1
  import_config: config/import.yaml

convert:                   # C2
  converter: pymupdf4llm   # with its layout model; chosen by the comparison (DEC-30)
  ocr_min_chars_per_page: 500
  workers: 1               # the layout model already uses every core: 1 worker gave 1.65 pages/s, 4 workers 1.15
  comparison_sample:       # SPEC-C2-11; mostly gold documents
    - {label: "Plusz call with many tables", name: dimop-plusz-126-24, doc_id: 95f2719354f4b21c}
    - {label: "old-generation TOP call", name: top-431-16, doc_id: 317b2dea1b0ba7e0}
    - {label: "VP call", name: vp6-7211-20, doc_id: 5bfe8e7220c6ef54}
    - {label: "product description", name: vekop-521-17, doc_id: abcc60a4aa00fd55}
    - {label: "RRF call", name: rrf-112-21, doc_id: acdf0bf199e87a47}
    - {label: "OCR case (a test file, not in the corpus)", name: dimop-plusz-123b-24-print, manual_file: "dimop-plusz-123B-24-felhívás.pdf"}

extract:                   # L1
  manual:
    gold_set: gold_second  # the gold pins are in acquire.import_config (DEC-34)
  llm:
    prompt: prompts/P5_system_prompt.txt
    model: claude-haiku-4-5-20251001   # the corpus run (DEC-18); the response records the model that answered
    temperature: 0
    thinking: null                      # null: the model's default; "disabled" or "between_tools" switches it off
    max_tokens: 8192
    max_parallel_requests: 4
    max_retries: 5                      # the SDK retries rate limits, overload and timeouts (SPEC-L1-12)
    budget_usd: null                    # a run over the corpus needs a ceiling
    prices_per_mtok:                    # USD; Anthropic's price table as of 2026-06-24 - check before a corpus run
      input: 1.00
      output: 5.00
    model_settings:                     # per-model overrides, e.g. for the gold comparison (SPEC-L1-14)
      claude-sonnet-5-5:                # the current Sonnet, for the gold comparison
        temperature: null               # Sonnet 5.5 rejects non-default sampling parameters
        thinking: between_tools         # thinking off; Sonnet 5.5 rejects "disabled"
        prices_per_mtok: {input: 2.00, output: 10.00}   # Anthropic's prices as of 2026-09-25
      claude-sonnet-5:
        temperature: null               # Sonnet 5 rejects sampling parameters
        thinking: disabled
        prices_per_mtok: {input: 2.00, output: 10.00}

consolidate:               # L2
  preferred_source:        # per factor, llm or regex, from the E1 report (SPEC-L2-03); accepted by the expert (DEC-62)
    fin_form: llm
    tam_osszeg: llm
    konzorcium: regex
    bead_napok: regex
    max_tam_int: llm
    eloleg: regex
    idotartam: regex
    tam_tevekenyseg: regex
    egysz_elszam: llm
    biztositek: regex
  preferences_from_e1_run: E1-20260930T143543-e8401f

label:                     # L3
  low_coverage_threshold: 5

validate:                  # E1; the corpus LLM of SPEC-E1-06 is extract.llm.model; the baseline is sources.old_baseline (DEC-42)
  old_baseline_renamed:    # calls renamed in the gold file since the baseline was recorded: old name → current name
    "GINOP Plusz-2.2.1-24": "GINOP Plusz-2.2.1-25"

represent:                 # M1
  representations: [tfidf, hubert, e5, bge_m3, bge_m3_512, qwen3_8b]   # bge_m3_512: DEC-64 no. 5, exploratory
  tfidf:                   # SPEC-M1-05; fitted inside each training fold by M2
    lowercase: true
    token_pattern: '(?u)\b\w\w+\b'   # \w keeps the Hungarian letters
    ngram_range: [1, 2]
    min_df: 2
    max_df: 0.9
    sublinear_tf: true
    max_features: 200000
    stop_words: hungarian  # the old list, cleaned (ISS-43)
  models:                  # input limits from the model cards; check them against the tokenizers (M1 §6)
    hubert:
      model_id: SZTAKI-HLT/hubert-base-cc
      revision: 028baac7feb87a7b2f042bbdaa5deec6513c6060   # the snapshot in the local cache (ARC-06)
      location: local
      pooling: mean        # no sentence-embedding head: the attention-masked mean (SPEC-M1-03)
      prefix: ""
      input_limit: 512
      normalize_chunks: false
      batch_size: 8
    e5:
      model_id: intfloat/multilingual-e5-large
      revision: 3d7cfbdacd47fdda877c5cd8a79fbcc4f2a574f3   # the snapshot in the local cache
      location: hosted     # DEC-24; locally only for the equivalence check
      provider: deepinfra  # DEC-66
      provider_model_id: intfloat/multilingual-e5-large
      pooling: mean
      prefix: "passage: "
      input_limit: 512     # DeepInfra truncates longer inputs to 512 tokens
      normalize_chunks: true
      batch_size: 4
      max_chunks_per_request: 64
      prices_per_mtok: {input: 0.010}   # DeepInfra, 2026-10-01
    bge_m3:
      model_id: BAAI/bge-m3
      revision: 5617a9f61b028005a4858fdac845db406aefb181   # the tokenizer snapshot of 2026-10-01 (ARC-06)
      location: hosted
      provider: deepinfra
      provider_model_id: BAAI/bge-m3
      pooling: cls
      prefix: ""
      input_limit: 8192
      normalize_chunks: true
      max_chunks_per_request: 8
      prices_per_mtok: {input: 0.010}   # DeepInfra, 2026-10-01
    bge_m3_512:            # the same model with 512-token chunks: the context-length axis (DEC-64 no. 5)
      model_id: BAAI/bge-m3
      revision: 5617a9f61b028005a4858fdac845db406aefb181
      location: hosted
      provider: deepinfra
      provider_model_id: BAAI/bge-m3
      pooling: cls
      prefix: ""
      input_limit: 512
      normalize_chunks: true
      max_chunks_per_request: 64
      prices_per_mtok: {input: 0.010}
    qwen3_8b:
      model_id: Qwen/Qwen3-Embedding-8B
      revision: 1d8ad4ca9b3dd8059ad90a75d4983776a23d44af   # the tokenizer snapshot of 2026-10-01 (ARC-06)
      location: hosted
      provider: deepinfra
      provider_model_id: Qwen/Qwen3-Embedding-8B
      pooling: last_token
      prefix: ""           # no instruction for documents
      input_limit: 32768
      normalize_chunks: true
      max_chunks_per_request: 2   # chunks of up to 32K tokens: two per request
      prices_per_mtok: {input: 0.010}   # DeepInfra, 2026-10-01
  providers:
    deepinfra:             # OpenAI-compatible embeddings API (DEC-45, DEC-66); the provider serves its own copy of the weights
      api: openai_compatible
      url: https://api.deepinfra.com/v1/openai/embeddings
      api_key_env: DEEPINFRA_API_KEY
      max_input_tokens: null
      max_chunks_per_request: 16   # a model's own setting wins
      margin_tokens: 8
      timeout_s: 300
  budget_usd: 5.0          # the ceiling for hosted computation in one invocation (SPEC-M1-04); about $1.5 expected
  max_retries: 5
  cache_index_batch: 32    # cache index rows written per batch (SPEC-M1-06)
  equivalence_check:       # SPEC-M1-07
    enabled: true
    representation: e5
    n_documents: 5
    min_cosine: 0.99

train:                     # M2
  representations: null    # null: every representation of the M1 run
  classifiers: [logreg, svm, rf, majority]
  classifier_params:       # SPEC-M2-04 defaults; C of logreg and svm is tuned when train.tuning is on
    logreg: {C: 1.0, class_weight: balanced, max_iter: 5000}
    svm: {C: 1.0, kernel: rbf, gamma: scale, class_weight: balanced, calibration_cv: 5}
    rf: {n_estimators: 500, class_weight: balanced, n_jobs: 1}
    majority: {}
  cv:
    n_splits: 5
    n_repeats: 5
    random_state: 42
  tuning:                  # DEC-63 (b), the confirmatory analysis; `train --no-tuning` gives the defaults (a)
    enabled: true
    classifiers: [logreg, svm]
    C: [0.01, 0.1, 1, 10, 100]
    inner_splits: 3        # stratified, shuffled with cv.random_state; scored by macro-F1; a tie goes to the smaller C
  n_jobs: 1                # folds fitted in parallel; the result does not depend on it
  grouped_check:           # SPEC-M2-08, optional
    enabled: false
    models: []             # e.g. [tfidf/logreg], the best model runs by E2

evaluate:                  # E2
  significance: true       # SPEC-E2-09: the best model run against each other one (corrected resampled t-test)

report:                    # E3; the chain of runs the report is built from (Spec_E3_Report.md §2.1)
  chain:                   # the E3 command's arguments override these
    e2_run: null           # the E2 run; its M2, L3 and C1 runs and theirs follow from the lineage
    e1_run: null           # the E1 run of the gold validation; null leaves the extraction part out
    l3_run: null           # only for a report without models (no E2 run)
