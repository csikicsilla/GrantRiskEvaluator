[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grantrisk"
version = "0.1.0"
description = "Grant Risk Estimator: risk labelling and classification of Hungarian grant calls (thesis prototype)"
readme = "README.md"
requires-python = ">=3.11"
# Each stage adds its own dependencies when it is implemented.
dependencies = [
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
grantrisk = "grantrisk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grantrisk = ["store/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
